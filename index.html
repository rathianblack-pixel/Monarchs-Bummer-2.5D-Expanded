#rotate .ph{width:46px;height:78px;border:4px solid #e0b050;border-radius:9px;animation:rot 2s ease-in-out infinite}
#rotate button{font:bold 15px monospace;background:#2a2030;color:#f0e4c8;border:2px solid #e0b050;padding:10px 18px;border-radius:6px}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
